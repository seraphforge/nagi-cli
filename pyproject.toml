[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nagi-cli"
version = "0.5.0"
description = "Local Ollama-powered coding and cybersecurity research CLI"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["typer>=0.12", "rich>=13", "httpx>=0.27", "PyYAML>=6.0"]

[project.scripts]
nagi = "nagi_cli.main:app"

[tool.setuptools.packages.find]
include = ["nagi_cli*"]
